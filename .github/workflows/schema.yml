name: GenLayer unsigned source schema check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run schema:studionet
