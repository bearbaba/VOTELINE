name: Verify deployed VOTELINE Registry
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/verify-registry.mjs
